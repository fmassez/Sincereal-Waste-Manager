version: '3.8'

services:
  wastemanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wastemanager
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - wastemanager-network

  # Optionnel: Base de données pour le mode multi-utilisateurs
